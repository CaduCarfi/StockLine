spring.application.name=medistock
server.port=8080

spring.data.mongodb.uri=${env.MONGODB_URI:${MONGODB_URI:mongodb://localhost:27017/medistock}}
spring.mongodb.uri=${env.MONGODB_URI:${MONGODB_URI:mongodb://localhost:27017/medistock}}

spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=America/Sao_Paulo

logging.level.org.springframework.data.mongodb.core=INFO

management.endpoints.web.exposure.include=health
management.endpoint.health.show-components=always