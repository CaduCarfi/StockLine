name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - master

jobs:
  backend:
    name: Backend - Tests and Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Start MongoDB
        run: docker compose up -d mongodb

      - name: Wait for MongoDB
        run: |
          timeout 90s bash -c '
            until docker exec medistock-mongo \
              mongosh \
              --username admin \
              --password admin123 \
              --authenticationDatabase admin \
              --eval "db.adminCommand(\"ping\")" > /dev/null 2>&1
            do
              echo "Aguardando MongoDB..."
              sleep 2
            done
          '

          echo "MongoDB está pronto!"

      - name: Verify MongoDB authentication
        run: |
          docker exec medistock-mongo \
            mongosh \
            "mongodb://admin:admin123@localhost:27017/medistock_test?authSource=admin&authMechanism=SCRAM-SHA-256" \
            --eval "db.getSiblingDB('medistock_test').runCommand({ ping: 1 })"

      - name: Run tests and check coverage
        env:
          MONGODB_URI: mongodb://admin:admin123@localhost:27017/medistock?authSource=admin&authMechanism=SCRAM-SHA-256
          MONGODB_TEST_URI: mongodb://admin:admin123@localhost:27017/medistock_test?authSource=admin&authMechanism=SCRAM-SHA-256
          SPRING_PROFILES_ACTIVE: teste
        working-directory: back
        run: mvn clean verify

      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: back/target/site/jacoco
          if-no-files-found: ignore

      - name: Stop MongoDB
        if: always()
        run: docker compose down -v

  frontend:
    name: Frontend - Tests and Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        working-directory: front
        run: npm ci

      - name: Run tests with coverage (threshold 70%)
        working-directory: front
        run: npm run test:coverage

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: front/coverage
          if-no-files-found: ignore
